[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "openai>=1.40",
    "python-dotenv>=1",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
job-search-agent = "job_search_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
